name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: Prepare static output for GitHub Pages
        working-directory: out
        run: |
          # Custom domain, and keep Jekyll from hiding the _next folder.
          echo "inventiveclicks.com" > CNAME
          touch .nojekyll
          # /services, /work and /blog exist both as X.html and as an X/ folder;
          # Pages resolves the folder, so give each folder an index.html.
          for f in *.html; do
            d="${f%.html}"
            if [ -d "$d" ] && [ ! -f "$d/index.html" ]; then cp "$f" "$d/index.html"; fi
          done

      - name: Publish to gh-pages branch
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
